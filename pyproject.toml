[project]
name = "context-optimization"
version = "0.1.0"
description = "Probability-guided optimization of answer-preserving context additions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
context-opt = "context_optimization.cli:main"

[project.urls]
Homepage = "https://xzx34.github.io/jevout/"
Paper = "https://arxiv.org/abs/2609.30243"
Repository = "https://github.com/xzx34/JevOut"
Issues = "https://github.com/xzx34/JevOut/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context_optimization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
